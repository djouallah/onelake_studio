# Publish the VS Code extension to the Marketplace.
#
# Triggered by a tag, so publishing is a deliberate act rather than a side effect of a
# push — unlike pages.yml, which deploys the web app on every commit to main. The two are
# independent: pages.yml only ever copies site/, so extension/ never reaches the web app,
# and this workflow never touches Pages.
#
# Needs a repository secret VSCE_PAT: an Azure DevOps Personal Access Token with
# Marketplace > Manage scope, belonging to the publisher named in extension/package.json.
# The publisher has to exist first — create it at https://marketplace.visualstudio.com/manage
#
# Release: bump "version" in extension/package.json, commit, then
#   git tag ext-v0.1.0 && git push origin ext-v0.1.0
name: Publish VS Code extension

on:
  push:
    tags: ["ext-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package only, do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The same suite Pages gates on. panel-html.test.js is the one that matters here: it
      # runs the webview's HTML rewriting against the real site/index.html, and a silent
      # failure there ships a panel that reads OneLake with no token.
      - run: npm test

      # vsce packages the extension directory and nothing above it, so site/ has to be
      # copied in. `vscode:prepublish` does this too; run it here so a dry run also proves
      # the copy works.
      - run: node extension/copy-site.mjs

      - name: Package
        working-directory: extension
        run: npx --yes @vscode/vsce package --out onelake-studio.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: onelake-studio-vsix
          path: extension/onelake-studio.vsix

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/ext-v')
        working-directory: extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath onelake-studio.vsix
