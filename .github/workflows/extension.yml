# Publishes the VS Code extension to the Marketplace when an ext-v* tag is pushed.
#
# Release:
#   bump "version" in package.json, refresh package-lock.json
#   (the "Refresh extension lockfile" workflow does it against the public registry), commit,
#   then  git tag ext-v<that version> && git push origin ext-v<that version>
#   A tag that does not match package.json fails the run before anything is built.
#
# PLATFORM-SPECIFIC, and it has to be. DuckDB runs natively in the extension host now:
# @duckdb/node-bindings loads a 37MB platform library, and npm only ever installs the binding
# matching the machine doing the install. One universal vsix would therefore carry ONE
# platform's library while claiming to serve all of them — silent at package time, total at
# run time. So every supported platform gets its own vsix, all cross-packaged on ubuntu by
# fetching that platform's binding tarball straight from the registry:
#
#   test  ->  package (one leg per target)  ->  publish (every vsix in ONE call)
#
# linux-armhf and web are deliberately absent: DuckDB publishes no binding for either, and an
# extension that installs and then cannot start is worse than one that is not offered. Those
# users keep the last universal release, which is the right answer. alpine-* is absent for a
# weaker reason — nothing here can test musl — and adding it needs one more thing: duckdb.js
# picks musl vs glibc through require('detect-libc') inside a try/catch that ANSWERS GLIBC
# when the require fails, so `!node_modules/detect-libc/**` would have to join .vscodeignore
# or an Alpine install would load a binding that is not in the package.
#
# The fan-in matters. Publishing from each leg would make six independent Marketplace calls,
# and leg five failing would leave a version half-published — four platforms live, two
# missing, and the version number already spent. Here, one failing leg means the publish job
# never runs and nothing goes out.
#
# NO TOKEN. Authentication is GitHub's OIDC exchanged for an Entra token, so there is nothing
# stored here that can leak or expire. That is not only hygiene: the Marketplace PAT has to be
# scoped to "All accessible organizations", and Azure DevOps retires that kind of PAT on
# 2026-12-01.
#
# The trust chain, for whoever debugs this later:
#   1. `id-token: write` lets the job mint a GitHub OIDC token. Without it azure/login fails
#      with an unhelpful error about being unable to get a token.
#   2. `environment: azure` puts the job's OIDC subject at
#      repo:djouallah/onelake_studio:environment:azure — which is exactly what the federated
#      credential on the Entra app trusts. Binding to the environment rather than a branch is
#      what stops a fork, or any other branch, from publishing.
#   3. azure/login trades that for an Entra token. `allow-no-subscriptions` because the app
#      has NO Azure role assignments at all — vsce only ever wants a token for the Azure
#      DevOps resource, never a subscription.
#   4. vsce --azure-credential picks the session up through DefaultAzureCredential.
# Only the publish job holds any of this. The build legs get no environment and no id-token,
# because packaging needs no identity.
#
# The app registration ("onelake-studio-marketplace-publish", client
# 066502f5-c8c9-4ecc-8a91-05889062b1f9) holds no client secret. Its Marketplace identity is
# f7ad18bc-e846-6506-9c98-cd2ec81fa38f, which must be a member of the `djouallah` publisher
# with the **Contributor** role — Creator is not enough, and getting that wrong is what
# produces "You need to be logged in with your corporate credentials" at the publish step
# after everything else has already succeeded.
#
# Every run packages and uploads every .vsix as an artifact, so workflow_dispatch is still a
# real dry run — it builds and attaches all of them, proves the OIDC identity, and only a tag
# reaches the publish step.
name: Publish VS Code extension

on:
  push:
    tags: ["ext-v*"]
  workflow_dispatch:

permissions:
  contents: read

# A publish is not atomic — vsce uploads the packages one at a time. Two runs doing that at
# once, or a cancellation halfway through, is exactly how a version ends up live on some
# platforms and missing on others. Queue instead, and never cancel.
concurrency:
  group: extension-publish
  cancel-in-progress: false

jobs:
  # The extension's own suite (test/), once rather than once per platform: it reads only tracked
  # sources, so its answer cannot differ between legs. panel-html.test.mjs is the one that
  # matters here — it runs the webview's HTML rewriting against the real app/index.html, and
  # a silent failure there ships a panel that reads OneLake with no token. Ahead of the
  # matrix, so a red test costs no build minutes.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # --skip-duplicate makes a mismatched tag a SILENT no-op: tagging ext-v0.2.0 while
      # package.json still says 0.1.3 would "publish" by re-sending 0.1.3 and report success.
      - name: The tag must name the version being released
        if: startsWith(github.ref, 'refs/tags/ext-v')
        run: |
          want="ext-v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME, but package.json says $want"; exit 1; }
      - run: npm test

  # The native engine itself, on the DuckDB that ships: real @duckdb/node-api, its linux
  # binding, and the extensions DuckDB installs on first use. npm test cannot cover this —
  # it runs without node_modules — and it is where a DuckDB major bump breaks.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      # The same bundle a linux-x64 vsix ships, so the test LOADs extensions by path the way
      # an installed extension does.
      - run: node fetch-extensions.mjs linux-x64
      - run: node --test test/engine-host.test.mjs

  package:
    needs: [test, engine]
    runs-on: ubuntu-latest
    strategy:
      # Every leg's failure is worth seeing in the same run; the publish job is gated on ALL
      # of them anyway, so cancelling early protects nothing.
      fail-fast: false
      matrix:
        target:
          - win32-x64
          - win32-arm64
          - darwin-x64
          - darwin-arm64
          - linux-x64
          - linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # vendor.mjs (run by vscode:prepublish, below) downloads the webview's libraries from
      # jsDelivr. Six legs is six chances for a CDN hiccup to fail one, and one failed leg
      # cancels the whole release. A vendor/ tree built from the same pins is reused as it
      # is, so a restored cache makes it a no-op with no network at all.
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('vendor.mjs', 'src/vendored.js') }}

      # NOT a plain `npm ci`. The eight platform bindings are optionalDependencies gated on
      # os/cpu, so a plain install drops 37MB of the RUNNER's platform into node_modules — and
      # vsce packages whatever the dependency walk reports, whatever --target says. Install
      # none of them, then fetch exactly one: every leg starts from the same empty state,
      # including the linux one that would otherwise be special.
      - name: Install the extension's dependencies, minus every binding
        run: npm ci --omit=optional --no-audit --no-fund

      # Puts THIS target's binding, and only this target's, into node_modules. The script
      # prunes siblings, drops npm's hidden lockfile so the dependency walk reads the real
      # tree, and refuses to succeed unless `npm list` — the exact command vsce runs — reports
      # the directory it just wrote.
      - name: Fetch the DuckDB binding for ${{ matrix.target }}
        id: binding
        run: node fetch-binding.mjs ${{ matrix.target }}

      # And this platform's DuckDB extensions (iceberg, azure, httpfs, avro + the optional
      # ones), so a first run offline or behind a proxy DuckDB cannot use still opens tables.
      - name: Bundle the DuckDB extensions for ${{ matrix.target }}
        run: node fetch-extensions.mjs ${{ matrix.target }}

      # The staged page carries the README and a build stamp. `vscode:prepublish` does this
      # too; running it here means a failure shows up as its own step.
      - run: node stage-webview.mjs

      # --target stamps TargetPlatform into the manifest AND names the file
      # onelake-studio-<target>-<version>.vsix, which is the name worth having on the
      # artifact. The major is pinned: an unpinned npx would let a future vsce 4 change how a
      # release is built without anyone choosing that. --changelog-path because vsce looks
      # for CHANGELOG.md beside package.json, and it lives in docs/.
      - name: Package
        run: npx --yes @vscode/vsce@3 package --target ${{ matrix.target }} --changelog-path docs/CHANGELOG.md

      # The only check that cannot lie. Everything above is a claim about node_modules; this
      # reads the artifact that actually ships. A vsix carrying two bindings is 37MB of waste,
      # and one carrying the wrong binding — or none — is an extension that installs and
      # cannot start.
      - name: The vsix must contain exactly one binding, and it must be this one
        run: |
          set -euo pipefail
          vsix=$(ls *.vsix)
          echo "checking $vsix"
          unzip -p "$vsix" extension.vsixmanifest | grep -q 'TargetPlatform="${{ matrix.target }}"' \
            || { echo "manifest does not claim ${{ matrix.target }}"; exit 1; }
          dirs=$(unzip -Z1 "$vsix" \
                 | sed -n 's|^extension/node_modules/@duckdb/\(node-bindings-[^/]*\)/.*|\1|p' \
                 | sort -u | tr '\n' ' ' | sed 's/ $//')
          [ "$dirs" = "${{ steps.binding.outputs.binding }}" ] \
            || { echo "expected exactly ${{ steps.binding.outputs.binding }}, found: $dirs"; exit 1; }
          unzip -Z1 "$vsix" | grep -qE '^extension/node_modules/@duckdb/node-bindings-[^/]+/.*\.(node|dll|so|dylib)$' \
            || { echo "no native library in the vsix"; exit 1; }
          for e in iceberg azure httpfs avro; do
            unzip -Z1 "$vsix" | grep -qx "extension/duckdb-extensions/$e.duckdb_extension"               || { echo "the vsix does not bundle the $e extension"; exit 1; }
          done
          echo "ok — $vsix carries $dirs and nothing else, and bundles its DuckDB extensions"

      # upload-artifact v4 refuses two jobs writing the same name, so the target is part of
      # it. overwrite lets "re-run failed jobs" replace a leg's output instead of failing on a
      # name a previous attempt already claimed.
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: "*.vsix"
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: azure
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout and no install: `vsce publish --packagePath` reads the manifest out of
      # each vsix and never runs vscode:prepublish. What goes out is exactly what was
      # packaged, checked and uploaded above — not a second build.
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: vsix

      - name: What is about to go out
        run: ls -l vsix

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Runs on every build, tag or not, and costs one request. It prints the identity the
      # Marketplace will actually see, which is the one fact worth having in the log: if a
      # publish ever fails on permissions, comparing this id against the publisher's member
      # list answers "wrong identity" vs "wrong role" immediately, instead of by guesswork.
      - name: Show the Marketplace identity
        run: |
          echo "Marketplace user id (must be a Contributor on publisher 'djouallah'):"
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
                  --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv

      # Only a tag publishes. One call for every platform: --packagePath is variadic, and vsce
      # takes each package's target from its own manifest. --skip-duplicate is the recovery
      # path — vsce uploads the packages one at a time with no rollback, so if the fifth
      # fails, re-running this job re-sends only what did not land. The price is that
      # re-pushing an already-published tag becomes a no-op instead of an error.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/ext-v')
        run: npx --yes @vscode/vsce@3 publish --azure-credential --skip-duplicate --packagePath vsix/*.vsix
