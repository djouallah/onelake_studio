# CI for the VS Code extension: what a release ships is built here, once.
#
# Every push and pull request runs test, engine and cli-os, then packages win32-x64 (what is installed
# here to try) and linux-x64 (what the browser test runs), and the browser, standalone and desktop
# tests: a few minutes. The full build, every platform's package and the desktop installer built,
# installed and started over the last release, is a manual run (workflow_dispatch, 30 minutes, the
# installer most of it): the run a release publishes from. A change to the website alone (Pages builds it) runs nothing here; docs/CHANGELOG.md is in
# the package, so a change to it still does.
#
# Release (release.yml): nothing is built again. The version is bumped BEFORE the build, so the
# vsix that is installed and tried is the one that goes out:
#   bump "version" in package.json, refresh package-lock.json
#   (the "Refresh extension lockfile" workflow does it against the public registry), give the
#   CHANGELOG's Unreleased items that version's heading, commit, push to main, and run the full
#   build on it: gh workflow run extension.yml --ref main. Try that run's vsix. Then  git tag ext-v<that version> && git push origin ext-v<that version>
#   and release.yml publishes this run's packages and installer, found by the tag's commit.
#
# PLATFORM-SPECIFIC, and it has to be. DuckDB runs natively in the extension host now:
# @duckdb/node-bindings loads a 37MB platform library, and npm only ever installs the binding
# matching the machine doing the install. One universal vsix would therefore carry ONE
# platform's library while claiming to serve all of them — silent at package time, total at
# run time. So every supported platform gets its own vsix, all cross-packaged on ubuntu by
# fetching that platform's binding tarball straight from the registry:
#
#   test, engine, cli-os  ->  package (one leg per target)  ->  release.yml publishes every vsix in ONE call
#
# linux-armhf and web are deliberately absent: DuckDB publishes no binding for either, and an
# extension that installs and then cannot start is worse than one that is not offered. Those
# users keep the last universal release, which is the right answer. alpine-* is absent for a
# weaker reason — nothing here can test musl — and adding it needs one more thing: duckdb.js
# picks musl vs glibc through require('detect-libc') inside a try/catch that ANSWERS GLIBC
# when the require fails, so `!node_modules/detect-libc/**` would have to join .vscodeignore
# or an Alpine install would load a binding that is not in the package.
#
# The fan-in matters. Publishing from each leg would make five independent Marketplace calls,
# and leg five failing would leave a version half-published — four platforms live, two
# missing, and the version number already spent. Here, one failing leg means the run is not
# green, and release.yml publishes only from a green run.
#
# The Marketplace sign-in below is release.yml's; nothing in this workflow signs in anywhere.
# NO TOKEN. Authentication is GitHub's OIDC exchanged for an Entra token, so there is nothing
# stored here that can leak or expire. That is not only hygiene: the Marketplace PAT has to be
# scoped to "All accessible organizations", and Azure DevOps retires that kind of PAT on
# 2026-12-01.
#
# The trust chain, for whoever debugs this later:
#   1. `id-token: write` lets the job mint a GitHub OIDC token. Without it azure/login fails
#      with an unhelpful error about being unable to get a token.
#   2. `environment: azure` puts the job's OIDC subject at
#      repo:djouallah/onelake_studio:environment:azure — which is exactly what the federated
#      credential on the Entra app trusts. Binding to the environment rather than a branch is
#      what stops a fork, or any other branch, from publishing.
#   3. azure/login trades that for an Entra token. `allow-no-subscriptions` because the app
#      has NO Azure role assignments at all — vsce only ever wants a token for the Azure
#      DevOps resource, never a subscription.
#   4. vsce --azure-credential picks the session up through DefaultAzureCredential.
# Only release.yml's publish job holds any of this. The build legs get no environment and no id-token,
# because packaging needs no identity.
#
# The app registration ("onelake-studio-marketplace-publish", client
# 066502f5-c8c9-4ecc-8a91-05889062b1f9) holds no client secret. Its Marketplace identity is
# f7ad18bc-e846-6506-9c98-cd2ec81fa38f, which must be a member of the `djouallah` publisher
# with the **Contributor** role — Creator is not enough, and getting that wrong is what
# produces "You need to be logged in with your corporate credentials" at the publish step
# after everything else has already succeeded.
#
# Every run packages and uploads every .vsix, and the installer, as artifacts (14 days): what
# release.yml publishes. A release later than that runs this workflow again on its commit first.
name: Extension

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!website/**"
      - "!docs/**"
      - "docs/CHANGELOG.md"
      - "!scripts/build-website.mjs"
      - "!scripts/website-shots.mjs"
      - "!.github/workflows/pages.yml"
  pull_request:
    paths:
      - "**"
      - "!website/**"
      - "!docs/**"
      - "docs/CHANGELOG.md"
      - "!scripts/build-website.mjs"
      - "!scripts/website-shots.mjs"
      - "!.github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Every job names its image (ubuntu-26.04) rather than ubuntu-latest, so the runner changes
# when this file does, not when GitHub moves the label.

# A newer push to the same branch supersedes a run still going. Publishing is release.yml's,
# which is never cancelled.
concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The extension's own suite (test/js/), once rather than once per platform: it reads only tracked
  # sources, so its answer cannot differ between legs. panel-html.test.mjs is the one that
  # matters here — it runs the webview's HTML rewriting against the real app/index.html, and
  # a silent failure there ships a panel that reads OneLake with no token. Ahead of the
  # matrix, so a red test costs no build minutes.
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm test

  # The native engine itself, on the DuckDB that ships: real @duckdb/node-api, its linux
  # binding, and the extensions DuckDB installs on first use. npm test cannot cover this —
  # it runs without node_modules — and it is where a DuckDB major bump breaks.
  engine:
    runs-on: ubuntu-26.04
    # A statement that never ends is a failure, not a job that waits for six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      # The same bundle a linux-x64 vsix ships, so the test LOADs extensions by path the way
      # an installed extension does. Cached by DuckDB's version (the lockfile) and the list.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: duckdb-extensions
          key: duckdb-extensions-linux-x64-${{ hashFiles('scripts/fetch-extensions.mjs', 'package-lock.json') }}
      - run: node scripts/fetch-extensions.mjs linux-x64
      - run: node --test test/js/engine-host.test.mjs test/js/engine-server.test.mjs
      # test/sql/*.test (sqllogictest) through the command line's sql: needs dax-sql (vendor/),
      # the tree the prepare job keeps in the cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/vendor.mjs', 'scripts/fetch-retry.mjs', 'src/vendored.js') }}
      - run: node scripts/vendor.mjs
      # The command line over all of it, as an agent meets it: the real process, no stand-ins but
      # OneLake. Measured here because only this job reaches `sql` and `model`; the spawned
      # bin/cli.mjs is counted too, through the NODE_V8_COVERAGE it inherits.
      - name: The command line, on the real engine, with its coverage
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=bin/cli.mjs --test-coverage-include=src/agent.js --test-coverage-include=src/bridge.js
          test/js/sqllogic.test.mjs test/js/cli-engine.test.mjs
          test/js/cli.test.mjs test/js/cli-contract.test.mjs test/js/agent.test.mjs test/js/bridge.test.mjs

  # The command line where it runs for most people: a named pipe, not a socket, and another
  # shell's idea of an argument. Everything but the engine, so nothing to install.
  cli-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: node --test test/js/bridge.test.mjs test/js/agent.test.mjs test/js/cli.test.mjs test/js/cli-contract.test.mjs test/js/cli-catalog.test.mjs test/js/cli-docs.test.mjs test/js/standalone.test.mjs

  # What every vsix carries whatever its platform, built once and kept in the cache for the
  # five package legs, which then restore it rather than build it five times: the webview's and
  # the web app's libraries (vendor/, from jsDelivr: one CDN hiccup here instead of five chances
  # to fail a leg), and Export to Fabric's function package.
  prepare:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/vendor.mjs', 'scripts/fetch-retry.mjs', 'src/vendored.js') }}
      - run: node scripts/vendor.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fabric-function
          key: fabric-function-${{ hashFiles('scripts/function-bundle.mjs', 'fabric_app/export/fabricapp.js', 'fabric_app/rayfin/**') }}
      - run: node scripts/function-bundle.mjs

  package:
    needs: [test, engine, cli-os, prepare]
    runs-on: ubuntu-26.04
    strategy:
      # Every leg's failure is worth seeing in the same run; a release needs ALL of them green
      # anyway, so cancelling early protects nothing.
      fail-fast: false
      matrix:
        # A push: what is tried here and what the browser test runs. The full build (workflow_dispatch): every platform.
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["win32-x64","darwin-x64","darwin-arm64","linux-x64","linux-arm64"]' || '["win32-x64","linux-x64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # vendor/ as the prepare job built it: vendor.mjs (run by vscode:prepublish, below) finds
      # the same pins and fetches nothing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/vendor.mjs', 'scripts/fetch-retry.mjs', 'src/vendored.js') }}

      # NOT a plain `npm ci`. The eight platform bindings are optionalDependencies gated on
      # os/cpu, so a plain install drops 37MB of the RUNNER's platform into node_modules — and
      # vsce packages whatever the dependency walk reports, whatever --target says. Install
      # none of them, then fetch exactly one: every leg starts from the same empty state,
      # including the linux one that would otherwise be special.
      - name: Install the extension's dependencies, minus every binding
        run: npm ci --omit=optional --no-audit --no-fund

      # Puts THIS target's binding, and only this target's, into node_modules. The script
      # prunes siblings, drops npm's hidden lockfile so the dependency walk reads the real
      # tree, and refuses to succeed unless `npm list` — the exact command vsce runs — reports
      # the directory it just wrote.
      - name: Fetch the DuckDB binding for ${{ matrix.target }}
        id: binding
        run: node scripts/fetch-binding.mjs ${{ matrix.target }}

      # And this platform's DuckDB extensions (iceberg, azure, httpfs, avro + the optional
      # ones), so a first run offline or behind a proxy DuckDB cannot use still opens tables.
      # Cached per platform; a restored tree with the same stamp is used as it is.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: duckdb-extensions
          key: duckdb-extensions-${{ matrix.target }}-${{ hashFiles('scripts/fetch-extensions.mjs', 'package-lock.json') }}
      - name: Bundle the DuckDB extensions for ${{ matrix.target }}
        run: node scripts/fetch-extensions.mjs ${{ matrix.target }}

      # Export to Fabric's function, as the deploy package Fabric takes (one esbuild bundle and
      # its metadata), built from fabric_app/rayfin so nobody who exports needs npm: the
      # prepare job's, from the cache (vscode:prepublish finds the same pins and builds nothing).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fabric-function
          key: fabric-function-${{ hashFiles('scripts/function-bundle.mjs', 'fabric_app/export/fabricapp.js', 'fabric_app/rayfin/**') }}
      - run: node scripts/function-bundle.mjs

      # The staged page (stage-webview.mjs) and the host's bundle (bundle.mjs) are built by
      # vscode:prepublish, which vsce runs as it packages.
      # --target stamps TargetPlatform into the manifest AND names the file
      # onelake-studio-<target>-<version>.vsix, which is the name worth having on the
      # artifact. The major is pinned: an unpinned npx would let a future vsce 4 change how a
      # release is built without anyone choosing that. --changelog-path because vsce looks
      # for CHANGELOG.md beside package.json, and it lives in docs/.
      - name: Package
        run: npx --yes @vscode/vsce@3.9.2 package --target ${{ matrix.target }} --changelog-path docs/CHANGELOG.md

      # The only check that cannot lie. Everything above is a claim about node_modules; this
      # reads the artifact that actually ships. A vsix carrying two bindings is 37MB of waste,
      # and one carrying the wrong binding — or none — is an extension that installs and
      # cannot start.
      - name: The vsix must contain exactly one binding, and it must be this one
        run: |
          set -euo pipefail
          vsix=$(ls *.vsix)
          echo "checking $vsix"
          unzip -p "$vsix" extension.vsixmanifest | grep -q 'TargetPlatform="${{ matrix.target }}"' \
            || { echo "manifest does not claim ${{ matrix.target }}"; exit 1; }
          dirs=$(unzip -Z1 "$vsix" \
                 | sed -n 's|^extension/node_modules/@duckdb/\(node-bindings-[^/]*\)/.*|\1|p' \
                 | sort -u | tr '\n' ' ' | sed 's/ $//')
          [ "$dirs" = "${{ steps.binding.outputs.binding }}" ] \
            || { echo "expected exactly ${{ steps.binding.outputs.binding }}, found: $dirs"; exit 1; }
          unzip -Z1 "$vsix" | grep -qE '^extension/node_modules/@duckdb/node-bindings-[^/]+/.*\.(node|dll|so|dylib)$' \
            || { echo "no native library in the vsix"; exit 1; }
          for e in iceberg azure httpfs avro quack ducklake; do
            unzip -Z1 "$vsix" | grep -qx "extension/duckdb-extensions/$e.duckdb_extension"               || { echo "the vsix does not bundle the $e extension"; exit 1; }
          done
          # The host ships as dist/extension.js (scripts/bundle.mjs): src/ stays out but for
          # bridge.js, which bin/cli.mjs requires, and node-api's JavaScript is in the bundle.
          files=$(unzip -Z1 "$vsix")
          grep -qx 'extension/dist/extension.js' <<<"$files" || { echo "no dist/extension.js in the vsix"; exit 1; }
          grep -qx 'extension/dist/engine-server.js' <<<"$files" || { echo "no dist/engine-server.js in the vsix"; exit 1; }
          grep -qx 'extension/dist/standalone.js' <<<"$files" || { echo "no dist/standalone.js in the vsix"; exit 1; }
          grep -qx 'extension/src/bridge.js' <<<"$files" || { echo "no src/bridge.js — bin/cli.mjs needs it"; exit 1; }
          # Export to Fabric writes its app from fabric_app/ and Studio's Explore (webview/explore),
          # and deploys the prebuilt function.
          for f in fabric_app/site/app.js fabric_app/site/storage/data.js fabric_app/rayfin/rayfin.yml webview/explore/view.js; do
            grep -qx "extension/$f" <<<"$files" || { echo "no $f in the vsix"; exit 1; }
          done
          # The web app's own packages (src/vendored.js VENDOR.webapp): its page loads nothing from a CDN.
          webapp=$(node -e "const w = require('./src/vendored.js').VENDOR.webapp, x = w.extensions;
            console.log([...w.esm.map(p => 'npm/' + p + '/+esm.js'), ...w.files.map(f => 'npm/' + f),
              ...x.names.map(n => 'duckdb-ext/' + x.duckdb + '/' + x.platform + '/' + n + '.duckdb_extension.wasm')].join(' '))")
          [ -n "$webapp" ] || { echo "no web app packages listed in src/vendored.js"; exit 1; }
          for f in $webapp; do
            grep -qxF "extension/vendor/webapp/$f" <<<"$files" || { echo "no vendor/webapp/$f in the vsix"; exit 1; }
          done
          for f in source.zip deploymetadata.json; do
            grep -qx "extension/fabric-function/$f" <<<"$files" || { echo "no fabric-function/$f in the vsix"; exit 1; }
          done
          stray=$(grep -E '^extension/src/' <<<"$files" | grep -vx 'extension/src/bridge.js' || true)
          [ -z "$stray" ] || { echo "src/ shipped beside the bundle: $stray"; exit 1; }
          ! grep -q '^extension/node_modules/@duckdb/node-api/' <<<"$files" \
            || { echo "@duckdb/node-api shipped beside the bundle"; exit 1; }
          echo "ok — $vsix carries $dirs and nothing else, bundles its DuckDB extensions, and runs from dist/extension.js"

      # The command line runs from the vsix alone, beside no src/ but bridge.js: a require that
      # packaging dropped fails here, not on an agent. Nothing listens, so `ls` must say exit 3.
      - name: The vsix's command line must run
        run: |
          set -euo pipefail
          unpacked="$RUNNER_TEMP/vsix-cli"
          rm -rf "$unpacked" && mkdir -p "$unpacked"
          unzip -q "$(ls *.vsix)" 'extension/bin/*' 'extension/src/*' 'extension/package.json' -d "$unpacked"
          cli="$unpacked/extension/bin/cli.mjs"
          node "$cli" --version | grep -q '^onelake-studio ' || { echo "--version did not answer"; exit 1; }
          node "$cli" --help | grep -q 'exit codes:' || { echo "--help did not answer"; exit 1; }
          code=0
          ONELAKE_STUDIO_BRIDGE="$unpacked/nobody.sock" node "$cli" ls || code=$?
          [ "$code" = 3 ] || { echo "ls with no extension exited $code, not 3"; exit 1; }

      # upload-artifact v4 refuses two jobs writing the same name, so the target is part of
      # it. overwrite lets "re-run failed jobs" replace a leg's output instead of failing on a
      # name a previous attempt already claimed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vsix-${{ matrix.target }}
          path: "*.vsix"
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # OneLake Studio as a signed-out user meets it: the linux-x64 vsix built above, in a real VS Code
  # server, its real interface in headless Chrome, Run and Plan from the editor through the panel
  # (test/e2e/run-vscode-web.mjs). OneLake's and Microsoft's hosts point at a listener here, so an
  # attempt to reach them shows up, whichever process makes it. The server's commit is pinned, as
  # the image is: VS Code changes here when this file does.
  browser:
    needs: package
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      VSCODE_COMMIT: 2c33b50b16c472efe58357d1d2a8a5414bc23fbf
      E2E_HOSTS: >-
        onelake.dfs.fabric.microsoft.com onelake.blob.fabric.microsoft.com
        onelake.table.fabric.microsoft.com api.fabric.microsoft.com app.fabric.microsoft.com
        analysis.windows.net api.powerbi.com login.microsoftonline.com login.live.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # playwright-core, without the engine: DuckDB here is the vsix's.
      - run: npm ci --omit=optional --no-audit --no-fund
      # dax-sql, to write the test's semantic model.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/vendor.mjs', 'scripts/fetch-retry.mjs', 'src/vendored.js') }}
      - run: node scripts/vendor.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vsix-linux-x64
          path: ${{ runner.temp }}/vsix
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/vscode-server
          key: vscode-server-linux-x64-web-${{ env.VSCODE_COMMIT }}
      - name: The VS Code server
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/vscode-server"
          if [ ! -x "$dir/bin/code-server" ]; then
            mkdir -p "$dir"
            curl -fsSL --retry 3 "https://update.code.visualstudio.com/commit:$VSCODE_COMMIT/server-linux-x64-web/stable"               | tar -xz -C "$dir" --strip-components=1
          fi
          "$dir/bin/code-server" --version
          echo "E2E_SERVER=$dir" >> "$GITHUB_ENV"
      - name: Chrome
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/chrome.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y "$RUNNER_TEMP/chrome.deb"
          fi
          google-chrome --version
      - name: OneLake's and Microsoft's hosts, pointed here
        run: |
          set -euo pipefail
          for host in $E2E_HOSTS; do echo "127.0.0.1 $host" | sudo tee -a /etc/hosts >/dev/null; done
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - name: The test's driver, as a vsix
        working-directory: test/e2e/driver
        run: npx --yes @vscode/vsce@3.9.2 package --allow-missing-repository --skip-license --no-dependencies -o "$RUNNER_TEMP/driver.vsix"
      - name: Signed out, in headless Chrome
        run: |
          set -euo pipefail
          export E2E_VSIX="$(ls "$RUNNER_TEMP"/vsix/*.vsix)"
          export E2E_DRIVER_VSIX="$RUNNER_TEMP/driver.vsix"
          export E2E_OUT="$RUNNER_TEMP/e2e"
          node test/e2e/run-vscode-web.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-test
          path: |
            ${{ runner.temp }}/e2e/shots
            ${{ runner.temp }}/e2e/*/data/data/logs
            ${{ runner.temp }}/e2e/**/engine-server/*.log
            ${{ runner.temp }}/e2e/**/engine-server/logs-*.sqlite
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  # The command line with VS Code closed, from the vsix a person installs, where it runs: Windows, its
  # DPAPI, a named pipe, its own engine server, and Excel's endpoint on a model file.
  standalone:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vsix-win32-x64
          path: ${{ runner.temp }}/vsix
      - name: Unpack the vsix
        shell: pwsh
        run: |
          $vsix = Get-ChildItem "$env:RUNNER_TEMP/vsix" -Filter *.vsix | Select-Object -First 1
          $zip = Join-Path $env:RUNNER_TEMP 'extension.zip'
          Copy-Item $vsix.FullName $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/unpacked"
      - run: node test/e2e/run-standalone.mjs "${{ runner.temp }}/unpacked/extension"

  # The desktop app: the win32-x64 vsix's files, with Node, and the extension bundled again with
  # `vscode` pointing at src/desktop/vscode.js. Driven in Edge first, as WebView2 is Edge, then built into
  # an installer, installed as a person would, and started once.
  desktop:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # The installer, built, installed and started: the full build only (workflow_dispatch).
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            desktop/src-tauri/target
          key: desktop-tauri-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vsix-win32-x64
          path: ${{ runner.temp }}/vsix
      - name: The app's files
        run: |
          $vsix = Get-ChildItem "$env:RUNNER_TEMP/vsix" -Filter *.vsix | Select-Object -First 1
          $zip = Join-Path $env:RUNNER_TEMP 'extension.zip'
          Copy-Item $vsix.FullName $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/unpacked"
          Move-Item "$env:RUNNER_TEMP/unpacked/extension" desktop/src-tauri/app
          npm ci --omit=optional --no-audit --no-fund
          node scripts/bundle-desktop.mjs desktop/src-tauri/app/dist/desktop.js
          Copy-Item -Recurse desktop/ui desktop/src-tauri/app/desktop-ui
          Copy-Item (Get-Command node).Source desktop/src-tauri/app/node.exe
      - name: The app, in Edge
        run: node test/e2e/run-desktop.mjs desktop/src-tauri/app "$env:RUNNER_TEMP/shots"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
      - name: Build the installer
        if: github.event_name == 'workflow_dispatch'
        working-directory: desktop
        # The cached target keeps the last version's installer, under its own name: only this build's goes on.
        run: |
          Remove-Item -Recurse -Force src-tauri/target/release/bundle -ErrorAction SilentlyContinue
          npx --yes @tauri-apps/cli@2.12.4 icon ../media/icon.png
          npx --yes @tauri-apps/cli@2.12.4 build
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: onelake-studio-setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Install it and start it once
        if: github.event_name == 'workflow_dispatch'
        working-directory: desktop
        run: |
          $setup = Get-Item src-tauri/target/release/bundle/nsis/*.exe
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = "$env:LOCALAPPDATA\OneLake Studio"
          $exe = Get-ChildItem $dir -Filter onelake-studio.exe -Recurse | Select-Object -First 1
          if (-not $exe) { Get-ChildItem $dir -Recurse -Depth 1; throw "the installed app was not found in $dir" }
          $result = "$env:RUNNER_TEMP\smoke.json"
          $env:ONELAKE_STUDIO_HOME = "$env:RUNNER_TEMP\smoke-home"
          $app = Start-Process $exe.FullName -ArgumentList '--smoke', "`"$result`"" -PassThru
          $null = $app.Handle   # without this, ExitCode comes back empty
          $finished = $app.WaitForExit(180000)
          Get-Content "$env:TEMP\onelake-studio-app.log" -ErrorAction SilentlyContinue
          if (-not $finished) { $app.Kill(); throw 'the app did not start within three minutes' }
          if (-not (Test-Path $result)) { throw "the app exited with $($app.ExitCode) and wrote nothing" }
          $answer = Get-Content $result -Raw
          Write-Host $answer
          if ($app.ExitCode -ne 0) { throw "it did not start: $answer" }
          $mb = { param($path) [math]::Round(((Get-ChildItem $path -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB) }
          @"
          | Desktop app | Size |
          | --- | --- |
          | Installer | $([math]::Round($setup.Length / 1MB)) MB |
          | Installed | $(& $mb $dir) MB |
          "@ | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - name: Install it over the last release, running
        if: github.event_name == 'workflow_dispatch'
        # What a user who updates does: the released app is installed and open, and this setup replaces it.
        working-directory: desktop
        run: |
          $dir = "$env:LOCALAPPDATA\OneLake Studio"
          $un = Start-Process "$dir\uninstall.exe" -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($un.ExitCode -ne 0) { throw "the uninstaller exited with $($un.ExitCode)" }
          if (Test-Path "$dir\onelake-studio.exe") { throw 'the uninstaller left onelake-studio.exe' }
          $old = "$env:RUNNER_TEMP\OneLake-Studio-Setup.exe"
          Invoke-WebRequest https://github.com/djouallah/onelake_studio/releases/latest/download/OneLake-Studio-Setup.exe -OutFile $old
          Start-Process $old -ArgumentList '/S' -Wait
          $released = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\OneLake Studio').DisplayVersion
          # With no VS Code, the app's data is in the install folder, next to app\: setup must keep it.
          New-Item -ItemType Directory -Force "$dir\data" | Out-Null
          Set-Content "$dir\data\kept.txt" 'mine'
          $env:ONELAKE_STUDIO_HOME = "$env:RUNNER_TEMP\smoke-home"
          $null = Start-Process "$dir\onelake-studio.exe" -PassThru
          Start-Sleep 20
          $setup = Get-Item src-tauri/target/release/bundle/nsis/*.exe
          $up = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($up.ExitCode -ne 0) { throw "setup over $released exited with $($up.ExitCode)" }
          $version = (Get-Content ../package.json -Raw | ConvertFrom-Json).version
          $now = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\OneLake Studio').DisplayVersion
          if ($now -ne $version) { throw "after setup over $released the installed version is $now, not $version" }
          if ((Get-Content "$dir\data\kept.txt" -ErrorAction SilentlyContinue) -ne 'mine') { throw "setup over $released lost the app's data" }
          $result = "$env:RUNNER_TEMP\smoke-upgrade.json"
          $app = Start-Process "$dir\onelake-studio.exe" -ArgumentList '--smoke', "`"$result`"" -PassThru
          $null = $app.Handle
          $finished = $app.WaitForExit(180000)
          if (-not $finished) { $app.Kill(); throw "over $released, the app did not start within three minutes" }
          if ($app.ExitCode -ne 0 -or -not (Test-Path $result)) { throw "over $released, it did not start: $(Get-Content $result -Raw -ErrorAction SilentlyContinue)" }
          Write-Host "$version installed over $released, open, and started"
