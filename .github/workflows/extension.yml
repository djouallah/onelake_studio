# Builds the VS Code extension and attaches the .vsix as an artifact.
#
# It does NOT publish. Publishing is one command from a laptop:
#
#   az login                                   # as the account owning the publisher
#   node extension/copy-site.mjs
#   cd extension && npx @vscode/vsce publish --azure-credential
#
# --azure-credential authenticates with Entra ID, which is why there is no VSCE_PAT secret
# here and no Azure DevOps Personal Access Token to create — that route needs a token minted
# under "All accessible organizations" with a Marketplace>Manage scope hidden behind "Show
# all scopes", by the same identity that owns the publisher. Not worth reproducing in CI for
# a release that happens by hand anyway.
#
# So this workflow's job is to prove a release WOULD build: it runs the tests and packages,
# on every ext-v* tag and on demand. Download the artifact to install a build locally.
#
# Independent of pages.yml, which deploys the web app on every commit to main: that one only
# ever copies site/, so extension/ never reaches Pages and this never touches it.
name: Build VS Code extension

on:
  push:
    tags: ["ext-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The same suite Pages gates on. panel-html.test.js is the one that matters here: it
      # runs the webview's HTML rewriting against the real site/index.html, and a silent
      # failure there ships a panel that reads OneLake with no token.
      - run: npm test

      # vsce packages the extension directory and nothing above it, so site/ and the LICENSE
      # have to be copied in. `vscode:prepublish` does this too; running it here means a
      # failure in the copy shows up as its own step.
      - run: node extension/copy-site.mjs

      - name: Package
        working-directory: extension
        run: npx --yes @vscode/vsce package --out onelake-studio.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: onelake-studio-vsix
          path: extension/onelake-studio.vsix
