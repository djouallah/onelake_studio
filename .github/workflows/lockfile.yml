# Regenerates package-lock.json against the PUBLIC npm registry and commits it.
#
# Exists because the lockfile cannot always be made where the code is written: a machine
# behind a corporate npm mirror resolves whatever that mirror happens to have (which lagged
# @duckdb/node-api 2.0 by days) and writes the mirror's URLs into `resolved`, which a
# runner then has no credentials for. Here the answer is registry.npmjs.org, sha512, every
# time.
#
# Run it from the Actions tab (or `gh workflow run lockfile.yml`) after changing a
# dependency in package.json.
name: Refresh extension lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # From scratch, not on top of the old file: an unchanged entry would otherwise keep
      # its old `resolved` URL. --package-lock-only resolves without installing anything.
      - name: Resolve
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund \
            --registry https://registry.npmjs.org
          grep -q '"resolved": "https://registry.npmjs.org/' package-lock.json
          ! grep -q 'pkgs.visualstudio.com\|packagefeedproxy' package-lock.json

      - name: Commit, if anything changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "lockfile already current"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lockfile resolved against the public registry"
          git push
