# Regenerates package-lock.json (the extension's and the Fabric function's) against the PUBLIC npm
# registry, writes the desktop app's Cargo.lock if it has none, and commits them.
#
# Exists because the lockfile cannot always be made where the code is written: a machine
# behind a corporate npm mirror resolves whatever that mirror happens to have (which lagged
# @duckdb/node-api 2.0 by days) and writes the mirror's URLs into `resolved`, which a
# runner then has no credentials for. Here the answer is registry.npmjs.org, sha512, every
# time.
#
# Run it from the Actions tab (or `gh workflow run lockfile.yml`) after changing a
# dependency in package.json.
name: Refresh extension lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # From scratch, not on top of the old file: an unchanged entry would otherwise keep
      # its old `resolved` URL. --package-lock-only resolves without installing anything.
      - name: Resolve
        run: |
          set -euo pipefail
          for dir in . fabric_app/rayfin/functions; do
            ( cd "$dir"
              rm -f package-lock.json
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund                 --registry https://registry.npmjs.org
              grep -q '"resolved": "https://registry.npmjs.org/' package-lock.json
              ! grep -q 'pkgs.visualstudio.com\|packagefeedproxy' package-lock.json )
          done

      # The desktop app's crates, by version and checksum: its build takes these and no others (--locked).
      # Written once and then kept: a crate moves when someone deletes the file and runs this again.
      - name: The desktop app's Cargo.lock, if there is none
        run: |
          [ -f desktop/src-tauri/Cargo.lock ] || cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml

      - name: Commit, if anything changed
        run: |
          git add package-lock.json fabric_app/rayfin/functions/package-lock.json desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "lockfiles already current"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lockfiles resolved against the public registries"
          git push
