# The website: website/, the icon and the screenshot, and docs/*.md rendered to pages, built by
# scripts/build-website.mjs. A push that doesn't touch it deploys nothing.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "media/icon.png"
      - "scripts/build-website.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # Only the renderer: the extension's own dependencies aren't needed here.
      - run: npm install --no-save --no-package-lock --ignore-scripts --prefix scripts marked@18.1.1
      - run: node scripts/build-website.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .tmp/site

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
