# Publish the app to GitHub Pages on every push to main.
#
# "Build" is just build.mjs copying site/ -> dist/ — the app is plain HTML/JS and loads
# DuckDB-WASM and MSAL from a CDN, so there is no bundler and nothing to install. The
# artifact is served at https://studio.projectscontrols.com/ (site/CNAME rides along in
# the copy, which is what tells Pages the custom domain).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # site/paths.js is plain ESM with no dependencies, so the suite runs straight off a
      # checkout with no npm install. A red suite must not reach Pages.
      - run: npm test
      # The site in a real browser before it goes live: DuckDB-WASM boots off the pinned CDN
      # build and answers the README landing query; the sign-in gate behaves (no silent
      # registration switch from a link, no VS Code probe without a reason); and signing in
      # with VS Code works end to end against the extension's real proxy and bridge.
      # playwright-core only — the runner's own Chrome is what drives the pages.
      - name: Browser checks
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund \
            --registry https://registry.npmjs.org playwright-core@1
          node test/run-boot-smoke.mjs
          node test/run-byo-gate.mjs
          node test/run-bridge-smoke.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
