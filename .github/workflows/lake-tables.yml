# OneLake tables through DuckLake (core/lake/onelaketable.js, core/lake/tableservice.js), tested on every push to main.
#
#   local:   every case of test/fixtures/lake/make_tables.py, written here by delta-rs (deletion vectors and a
#            checkpoint in parts written as Spark writes them), read through DuckLake against delta_scan; a table
#            followed commit by commit; the table service on files it "downloads" from the fixtures.
#   onelake: the same cases uploaded to fabriccat (workspace tmp, lakehouse data, Tables/test/lakeci_*), read
#            there, and the table service for real: what a statement reads comes down over HTTPS, and reads with
#            the token gone.
#   export:  Export to Fabric from this checkout, published to the same workspace (test/js/export-fabric.test.mjs);
#            then the app's page in Chrome, reading a table of that lakehouse (test/js/run-fabric-app.mjs), and
#            the app whole on a local Rayfin backend, from its sign-in to its Report (test/js/run-fabric-local.mjs).
#
# Signing in to fabriccat: no secret. The job's OIDC subject is what the federated credential on the Entra app
# `fabric-github-deploy` trusts (onelake-studio-main), the app the other repos' workflows sign in as. Subjects carry the owner's and the repository's ids, so it is
# repo:djouallah@12554469/onelake_studio@1311910860:ref:refs/heads/main, not the plain names. Its service
# principal may call Fabric's APIs and is a Contributor of tmp.
# Any other branch, a fork or a pull request gets no token, and its onelake job fails at the sign-in.
name: Lake tables

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lake-tables-${{ github.ref }}
  cancel-in-progress: true

# Where the cases are written. Set only on the steps that read them: npm test runs every test file, and these
# skip unless it is set.
env:
  FIXTURES_DIR: ${{ github.workspace }}/.tmp/lake

jobs:
  local:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install deltalake==1.5.0 pyarrow==24.0.0 pyroaring==1.1.0
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: duckdb-extensions
          key: duckdb-extensions-linux-x64-${{ hashFiles('scripts/fetch-extensions.mjs', 'package-lock.json') }}
      - run: node scripts/fetch-extensions.mjs linux-x64
      - run: npm test
      - run: python test/fixtures/lake/make_tables.py "$FIXTURES_DIR"
      - run: node --test test/js/onelaketable.test.mjs
        env:
          LAKE_FIXTURES: ${{ env.FIXTURES_DIR }}
          NO_SKIP: 1

  onelake:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      ONELAKE_TABLES: abfss://${{ vars.ONELAKE_CI_WORKSPACE }}@onelake.dfs.fabric.microsoft.com/${{ vars.ONELAKE_CI_LAKEHOUSE }}.Lakehouse/Tables/test
      ONELAKE_CI_CLIENT_ID: ${{ vars.ONELAKE_CI_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install deltalake==1.5.0 pyarrow==24.0.0 pyroaring==1.1.0
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: duckdb-extensions
          key: duckdb-extensions-linux-x64-${{ hashFiles('scripts/fetch-extensions.mjs', 'package-lock.json') }}
      - run: node scripts/fetch-extensions.mjs linux-x64
      - name: Sign in to fabriccat as fabric-github-deploy
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.ONELAKE_CI_CLIENT_ID }}
          tenant-id: ${{ vars.ONELAKE_CI_TENANT_ID }}
          allow-no-subscriptions: true
      - name: A storage token for OneLake
        run: |
          t=$(az account get-access-token --resource https://storage.azure.com --query accessToken -o tsv)
          echo "::add-mask::$t"
          echo "ONELAKE_TOKEN=$t" >> "$GITHUB_ENV"
      # DuckDB's azure extension refused every read here with curl's "Problem with the SSL CA cert". It
      # looks for the system's bundle by fixed paths; which of them this image has is printed, and the
      # bundle is linked into each one that is missing.
      - name: The system's CA bundle where the azure extension looks
        run: |
          for p in /etc/ssl/certs/ca-certificates.crt /etc/pki/tls/certs/ca-bundle.crt /etc/ssl/ca-bundle.pem /etc/pki/tls/cacert.pem /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem /etc/ssl/cert.pem; do
            if [ -e "$p" ]; then echo "present: $p"; else echo "missing: $p"; sudo mkdir -p "$(dirname "$p")"; sudo ln -s /etc/ssl/certs/ca-certificates.crt "$p"; fi
          done
          echo "CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
      - run: python test/fixtures/lake/make_tables.py "$FIXTURES_DIR"
      - name: The cases, uploaded to Tables/test/lakeci_*
        run: |
          https="https://onelake.dfs.fabric.microsoft.com/${{ vars.ONELAKE_CI_WORKSPACE }}/${{ vars.ONELAKE_CI_LAKEHOUSE }}.Lakehouse/Tables/test"
          for c in $(python -c "import json,sys; print(' '.join(k for k,v in json.load(open(sys.argv[1])).items() if v['made']))" "$FIXTURES_DIR/cases.json"); do
            python test/fixtures/lake/upload.py "$FIXTURES_DIR/$c" "$https/lakeci_$c"
          done
      - run: node --test test/js/onelake-tables.test.mjs
        env:
          LAKE_FIXTURES: ${{ env.FIXTURES_DIR }}
          NO_SKIP: 1

  # Export to Fabric, for real, as the same identity (test/js/export-fabric.test.mjs): a model file of
  # lakeci_plain published as a client-side app with its function, and made a Direct Lake semantic model.
  # The app (lakeci-explore) and the model (lakeci_model) stay in the workspace, replaced by each run.
  # A semantic model's own app is not published here: Fabric refuses a service principal its connector.
  export:
    needs: onelake
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ONELAKE_CI_WORKSPACE: ${{ vars.ONELAKE_CI_WORKSPACE }}
      ONELAKE_CI_LAKEHOUSE: ${{ vars.ONELAKE_CI_LAKEHOUSE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # What an export uploads besides the checkout: the page's packages and the function's deploy package,
      # the caches the Extension workflow's prepare job keeps.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/vendor.mjs', 'scripts/fetch-retry.mjs', 'core/vendored.js') }}
      - run: node scripts/vendor.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fabric-function
          key: fabric-function-${{ hashFiles('scripts/function-bundle.mjs', 'fabric_app/export/fabricapp.js', 'fabric_app/rayfin/**') }}
      - run: node scripts/function-bundle.mjs
      - name: Sign in to fabriccat as fabric-github-deploy
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.ONELAKE_CI_CLIENT_ID }}
          tenant-id: ${{ vars.ONELAKE_CI_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Tokens for the Fabric API, the Power BI API and OneLake
        run: |
          for pair in FABRIC_TOKEN=https://api.fabric.microsoft.com POWERBI_TOKEN=https://analysis.windows.net/powerbi/api ONELAKE_TOKEN=https://storage.azure.com; do
            t=$(az account get-access-token --resource "${pair#*=}" --query accessToken -o tsv)
            echo "::add-mask::$t"
            echo "${pair%%=*}=$t" >> "$GITHUB_ENV"
          done
      - run: node --test test/js/export-fabric.test.mjs
        env:
          NO_SKIP: 1
      # The two tests below open the app in Chrome, on a local Rayfin backend: playwright-core, Chrome, rayfin-local.
      - if: always()
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund
      - name: Chrome
        if: always()
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/chrome.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y "$RUNNER_TEMP/chrome.deb"
          fi
          google-chrome --version
      # rayfin-local, Microsoft's local Rayfin backend: it runs the function an export packages and serves its site,
      # and answers the page's SDK as Fabric's backend does. The release, by its checksum: a new one is taken on
      # purpose, with its hash.
      - name: rayfin-local
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RAYFIN_LOCAL_VERSION: 0.2.8
          RAYFIN_LOCAL_SHA256: 399f2215bffe9e940d500ed6cc08a468d64ac5a0d267aafca9198667a4dda6c2
        run: |
          set -euo pipefail
          name="rayfin-local-$RAYFIN_LOCAL_VERSION-x86_64-unknown-linux-gnu"
          gh release download "v$RAYFIN_LOCAL_VERSION" -R microsoft/rayfin-local -p "$name.tar.gz" -D "$RUNNER_TEMP"
          echo "$RAYFIN_LOCAL_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          bin=$(find "$RUNNER_TEMP" -type f -name rayfin-local | head -1)
          "$bin" --version
          echo "RAYFIN_LOCAL=$bin" >> "$GITHUB_ENV"
      # The app whole, from no session (test/js/run-fabric-local.mjs), both kinds: the page signs in with its own
      # sign-in, in a tab and inside the frame that plays Fabric, asks its function for the tables or its connector
      # for the model, and draws its Report.
      - if: always()
        run: node test/js/run-fabric-local.mjs
        env:
          # Power BI answers the CI identity's DAX on lakeci_model (it did on 2026-11-11, where it was thought to refuse it):
          # the app on a semantic model draws its Report. `refused` is for an identity Power BI turns down.
          FABRIC_LOCAL_MODEL: answers
      # The app's data source on a large table (test/js/run-fabric-app.mjs): the same sign-in and function, then
      # aemo.price read from OneLake with the function's SAS, each query whole and shared out between the engines.
      - if: always()
        run: node test/js/run-fabric-app.mjs
        env:
          FABRIC_APP_TABLE: aemo.price
          FABRIC_APP_SUM: RRP
          FABRIC_APP_BY: REGIONID
