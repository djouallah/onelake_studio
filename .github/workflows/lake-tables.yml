# OneLake tables through DuckLake (core/lake/onelaketable.js, core/lake/tableservice.js), tested on every push to main.
#
#   local:   every case of test/fixtures/lake/make_tables.py, written here by delta-rs (deletion vectors and a
#            checkpoint in parts written as Spark writes them), read through DuckLake against delta_scan; a table
#            followed commit by commit; the table service on files it "downloads" from the fixtures.
#   onelake: the same cases uploaded to fabriccat (workspace tmp, lakehouse data, Tables/test/lakeci_*), read
#            there, and the table service for real: what a statement reads comes down over HTTPS, and reads with
#            the token gone. Then SQL's writes there: Iceberg tables and a file (test/js/onelake-writes.test.mjs).
#   server-writes: a big write through the engine's server process, on Linux and on Windows, and the server
#            after it (test/js/onelake-server-writes.test.mjs).
#
# Signing in to fabriccat: no secret. The job's OIDC subject is what the federated credential on the Entra app
# `fabric-github-deploy` trusts (onelake-studio-main), the app the other repos' workflows sign in as. Subjects carry the owner's and the repository's ids, so it is
# repo:djouallah@12554469/onelake_studio@1311910860:ref:refs/heads/main, not the plain names. Its service
# principal may call Fabric's APIs and is a Contributor of tmp.
# Any other branch, a fork or a pull request gets no token, and its onelake job fails at the sign-in.
name: Lake tables

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lake-tables-${{ github.ref }}
  cancel-in-progress: true

# Where the cases are written. Set only on the steps that read them: npm test runs every test file, and these
# skip unless it is set.
env:
  FIXTURES_DIR: ${{ github.workspace }}/.tmp/lake

jobs:
  local:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install deltalake==1.5.0 pyarrow==24.0.0 pyroaring==1.1.0
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: duckdb-extensions
          key: duckdb-extensions-linux-x64-${{ hashFiles('scripts/fetch-extensions.mjs', 'package-lock.json') }}
      - run: node scripts/fetch-extensions.mjs linux-x64
      # dax-sql (vendor/): npm test reads the real one (test/js/daxsql.mjs).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/vendor.mjs', 'scripts/fetch-retry.mjs', 'core/vendored.js') }}
      - run: node scripts/vendor.mjs
      - run: npm test
      # A table's health from the lake's own metadata: needs DuckDB, which this job has.
      - run: node --test test/js/health.test.mjs
        env:
          NO_SKIP: 1
      - run: python test/fixtures/lake/make_tables.py "$FIXTURES_DIR"
      - run: node --test test/js/onelaketable.test.mjs
        env:
          LAKE_FIXTURES: ${{ env.FIXTURES_DIR }}
          NO_SKIP: 1

  onelake:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      ONELAKE_TABLES: abfss://${{ vars.ONELAKE_CI_WORKSPACE }}@onelake.dfs.fabric.microsoft.com/${{ vars.ONELAKE_CI_LAKEHOUSE }}.Lakehouse/Tables/test
      ONELAKE_CI_CLIENT_ID: ${{ vars.ONELAKE_CI_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install deltalake==1.5.0 pyarrow==24.0.0 pyroaring==1.1.0
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: duckdb-extensions
          key: duckdb-extensions-linux-x64-${{ hashFiles('scripts/fetch-extensions.mjs', 'package-lock.json') }}
      - run: node scripts/fetch-extensions.mjs linux-x64
      - name: Sign in to fabriccat as fabric-github-deploy
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.ONELAKE_CI_CLIENT_ID }}
          tenant-id: ${{ vars.ONELAKE_CI_TENANT_ID }}
          allow-no-subscriptions: true
      - name: A storage token for OneLake
        run: |
          t=$(az account get-access-token --resource https://storage.azure.com --query accessToken -o tsv)
          echo "::add-mask::$t"
          echo "ONELAKE_TOKEN=$t" >> "$GITHUB_ENV"
      # DuckDB's azure extension refused every read here with curl's "Problem with the SSL CA cert". It
      # looks for the system's bundle by fixed paths; which of them this image has is printed, and the
      # bundle is linked into each one that is missing.
      - name: The system's CA bundle where the azure extension looks
        run: |
          for p in /etc/ssl/certs/ca-certificates.crt /etc/pki/tls/certs/ca-bundle.crt /etc/ssl/ca-bundle.pem /etc/pki/tls/cacert.pem /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem /etc/ssl/cert.pem; do
            if [ -e "$p" ]; then echo "present: $p"; else echo "missing: $p"; sudo mkdir -p "$(dirname "$p")"; sudo ln -s /etc/ssl/certs/ca-certificates.crt "$p"; fi
          done
          echo "CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
      - run: python test/fixtures/lake/make_tables.py "$FIXTURES_DIR"
      - name: The cases, uploaded to Tables/test/lakeci_*
        run: |
          https="https://onelake.dfs.fabric.microsoft.com/${{ vars.ONELAKE_CI_WORKSPACE }}/${{ vars.ONELAKE_CI_LAKEHOUSE }}.Lakehouse/Tables/test"
          # The read-only cases are tested against themselves on OneLake (its rows against delta_scan of the same
          # table), so they go up again only when what makes them changed: a marker in Files/ names that.
          key=$( (cat test/fixtures/lake/make_tables.py test/fixtures/lake/upload.py; grep -m1 'pip install deltalake' .github/workflows/lake-tables.yml) | sha256sum | cut -c1-16)
          marker="https://onelake.dfs.fabric.microsoft.com/${{ vars.ONELAKE_CI_WORKSPACE }}/${{ vars.ONELAKE_CI_LAKEHOUSE }}.Lakehouse/Files/lakeci/fixtures-$key"
          auth=(-H "Authorization: Bearer $ONELAKE_TOKEN" -H "x-ms-version: 2023-11-03")
          if curl -sf -o /dev/null -I "${auth[@]}" "$marker"; then
            echo "the read-only cases are on OneLake already, as fixtures-$key made them"
          else
            for c in $(python -c "import json,sys; print(' '.join(k for k,v in json.load(open(sys.argv[1])).items() if v['made']))" "$FIXTURES_DIR/cases.json"); do
              python test/fixtures/lake/upload.py "$FIXTURES_DIR/$c" "$https/lakeci_$c"
            done
            curl -sf -X PUT "${auth[@]}" -H "Content-Length: 0" "$marker?resource=file" > /dev/null
          fi
          # Delta tables for the writes test to INSERT into, which no other test reads: the plain case again, and
          # one of each Delta feature.
          python test/fixtures/lake/upload.py "$FIXTURES_DIR/plain" "$https/lakeci_deltawrite"
          for c in dv_packed column_mapping part_multi checkpoint types empty; do
            if [ -d "$FIXTURES_DIR/$c" ]; then python test/fixtures/lake/upload.py "$FIXTURES_DIR/$c" "$https/lakeci_dw_$c"; fi
          done
      - run: node --test test/js/onelake-tables.test.mjs
        env:
          LAKE_FIXTURES: ${{ env.FIXTURES_DIR }}
          NO_SKIP: 1
      # SQL's writes: DuckDB's Iceberg writes through the lakehouse's Iceberg catalog, and a COPY to its Files/,
      # on the engine with its lockdown. The tables a run makes are dropped by the test, past the engine.
      # Run whatever the tables' test said: it reads, this writes, and neither needs the other.
      - if: ${{ !cancelled() }}
        run: node --test test/js/onelake-writes.test.mjs
        env:
          ONELAKE_CI_WORKSPACE: ${{ vars.ONELAKE_CI_WORKSPACE }}
          ONELAKE_CI_LAKEHOUSE: ${{ vars.ONELAKE_CI_LAKEHOUSE }}
          NO_SKIP: 1

  # A big write as a user runs one: through the engine's server process, over Quack, on Linux and on Windows, where
  # most of them are. The coffee benchmark's tables at 20 million orders, then the server asked whether it is still
  # the one that started. Each run's tables carry its platform and its time, and are dropped by the test.
  server-writes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, target: linux-x64 }
          - { os: windows-latest, target: win32-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: duckdb-extensions
          key: duckdb-extensions-${{ matrix.target }}-${{ hashFiles('scripts/fetch-extensions.mjs', 'package-lock.json') }}
      - run: node scripts/fetch-extensions.mjs ${{ matrix.target }}
      - name: Sign in to fabriccat as fabric-github-deploy
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.ONELAKE_CI_CLIENT_ID }}
          tenant-id: ${{ vars.ONELAKE_CI_TENANT_ID }}
          allow-no-subscriptions: true
      - name: A storage token for OneLake
        shell: bash
        run: |
          t=$(az account get-access-token --resource https://storage.azure.com --query accessToken -o tsv)
          echo "::add-mask::$t"
          echo "ONELAKE_TOKEN=$t" >> "$GITHUB_ENV"
      - name: The system's CA bundle where the azure extension looks
        if: runner.os == 'Linux'
        run: |
          for p in /etc/ssl/certs/ca-certificates.crt /etc/pki/tls/certs/ca-bundle.crt /etc/ssl/ca-bundle.pem /etc/pki/tls/cacert.pem /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem /etc/ssl/cert.pem; do
            if [ ! -e "$p" ]; then sudo mkdir -p "$(dirname "$p")"; sudo ln -s /etc/ssl/certs/ca-certificates.crt "$p"; fi
          done
          echo "CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
      - run: node --test test/js/onelake-server-writes.test.mjs
        env:
          ONELAKE_CI_WORKSPACE: ${{ vars.ONELAKE_CI_WORKSPACE }}
          ONELAKE_CI_LAKEHOUSE: ${{ vars.ONELAKE_CI_LAKEHOUSE }}
          NO_SKIP: 1
