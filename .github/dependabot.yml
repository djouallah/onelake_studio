# A pull request a week for what has moved, grouped, so a fix upstream is seen without anyone looking.
# The Extension workflow runs on each, and nothing merges by itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      extension: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /fabric_app/rayfin/functions
    schedule: { interval: weekly }
    groups:
      function: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: weekly }
    groups:
      desktop: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
