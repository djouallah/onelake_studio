<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="{{csp}}" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OneLake Studio</title>
  <link rel="stylesheet" href="{{base}}/explore/explore.css" />
  <style>
    /* The editor's theme IS the palette: a webview gets every --vscode-* colour on :root,
       and names its theme kind on <body>. Every rule below uses these names, so the panel
       follows a light, dark or high-contrast theme — including one switched while open. */
    :root {
      --bg:      var(--vscode-editor-background);
      --panel:   var(--vscode-sideBar-background, var(--vscode-editor-background));
      --panel2:  var(--vscode-editorGroupHeader-tabsBackground, var(--vscode-editor-background));
      --border:  var(--vscode-panel-border, var(--vscode-editorWidget-border, rgba(128,128,128,0.35)));
      --text:    var(--vscode-foreground);
      --muted:   var(--vscode-descriptionForeground);
      --accent:  var(--vscode-button-background);
      --accent2: var(--vscode-textLink-foreground);
      --ok:      var(--vscode-charts-green);
      --warn:    var(--vscode-charts-yellow);
      --err:     var(--vscode-errorForeground);
      --hover:   var(--vscode-list-hoverBackground);
      --sel:     var(--vscode-list-activeSelectionBackground);
      --stripe:  var(--vscode-tree-tableOddRowsBackground, transparent);
      /* explore/explore.css's own tokens (the semantic model view). */
      --card:      var(--panel);
      --input-bg:  var(--vscode-input-background, var(--panel2));
      --raised:    var(--vscode-list-hoverBackground);
      --row-line:  var(--border);
      --faint:     var(--vscode-disabledForeground, var(--muted));
      --disabled:  var(--vscode-disabledForeground, var(--muted));
      --on-accent: var(--vscode-button-foreground);
      --hairline:  var(--border);
      --hover-soft: var(--vscode-list-hoverBackground);
      --bad:       var(--err);
      --shadow:    0 6px 18px var(--vscode-widget-shadow, rgba(0,0,0,0.35));
    }
    /* OS-drawn parts (scrollbars, the caret) read `color-scheme`, not colours. */
    body.vscode-light, body.vscode-high-contrast-light { color-scheme: light; }
    body.vscode-dark, body.vscode-high-contrast { color-scheme: dark; }

    * { box-sizing: border-box; }
    /* The UA's own `[hidden] { display: none }` is a plain attribute selector, so ANY class
       rule with a display of its own silently outranks it — and el.hidden is how this page
       takes things off screen. */
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--vscode-font-family); font-size: var(--vscode-font-size); line-height: 1.5;
      display: flex; flex-direction: column;
    }
    a { color: var(--accent2); }
    button {
      font: inherit; cursor: pointer; padding: 0.3rem 0.7rem; border-radius: 2px;
      background: var(--vscode-button-secondaryBackground, var(--vscode-input-background));
      color: var(--vscode-button-secondaryForeground, var(--text));
      border: 1px solid var(--vscode-button-border, var(--vscode-contrastBorder, transparent));
    }
    button:hover:not(:disabled) { background: var(--vscode-button-secondaryHoverBackground, var(--hover)); }
    button:disabled { opacity: 0.5; cursor: default; }
    button.primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
    button.primary:hover:not(:disabled) { background: var(--vscode-button-hoverBackground); }
    :focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: -1px; }

    /* Two-state switches: Stats | Data for a table, Pretty | Raw for a document. */
    .tabs { display: inline-flex; }
    button.tab {
      padding: 0.15rem 0.6rem; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--muted); background: transparent; border: 1px solid var(--border);
    }
    button.tab + button.tab { border-left: 0; }
    button.tab.active { color: var(--text); background: var(--sel); border-color: var(--accent2); }

    /* Content */
    section { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
    .toolbar { display: flex; gap: 0.5rem; align-items: center; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .toolbar .title { font-weight: 600; }
    .toolbar .spacer { flex: 1; }
    .resultsWrap { flex: 1; overflow: auto; }
    /* The SQL box (app.js): the page's own, so a query never opens a .sql file. */
    #sqlEditor {
      width: 100%; min-height: 96px; height: 160px; max-height: 50vh; resize: vertical; padding: 0.6rem 0.75rem;
      border: 0; border-bottom: 1px solid var(--border); background: var(--vscode-editor-background); color: var(--text);
      font-family: var(--vscode-editor-font-family); font-size: var(--vscode-editor-font-size); flex: none;
    }
    #sqlEditor:focus { outline: 1px solid var(--vscode-focusBorder); outline-offset: -1px; }
    /* A semantic model's view has its own SQL box and Show plan. */
    section.modelOpen #sqlEditor, section.modelOpen #runBtn, section.modelOpen #planBtn, section.modelOpen #saveQueryBtn { display: none; }
    /* Pivot is a table's; Edit SQL puts a model's SQL in the box too (app.js). */
    section:not(.tableOpen) #pivotBtn { display: none; }
    /* A table's Pivot takes the place of the results, as a model's view does; it has its own Edit SQL. */
    #pivotView { flex: 1; overflow: auto; min-height: 0; }
    section.pivotOpen .resultsWrap, section.pivotOpen #csvBtn, section.pivotOpen #profileBtn, section.pivotOpen #chartBtn,
    section.pivotOpen #editSqlBtn, section.pivotOpen #sqlEditor, section.pivotOpen #runBtn, section.pivotOpen #planBtn,
    section.pivotOpen #saveQueryBtn,
    section.pivotOpen #pivotBtn { display: none; }
    table.results { border-collapse: collapse; width: 100%; font-size: 13px; }
    table.results th, table.results td {
      border: 1px solid var(--border); padding: 0.3rem 0.55rem; text-align: left; white-space: nowrap;
      max-width: 420px; overflow: hidden; text-overflow: ellipsis;
    }
    table.results th {
      position: sticky; top: 0; z-index: 1; vertical-align: bottom;
      background: var(--vscode-keybindingTable-headerBackground, var(--panel));
    }
    /* The column type rides under its name in the header. */
    table.results th .cname { display: block; }
    /* A click on a header sorts by it (app.js renderResults). */
    table.results thead th { cursor: pointer; user-select: none; }
    table.results thead th:hover { color: var(--vscode-textLink-foreground, var(--accent2)); }
    table.results th .ctype { display: block; font-weight: 400; font-size: 0.72rem; color: var(--accent2); letter-spacing: 0.2px; }
    table.results th.num { text-align: right; }
    table.results td.num { text-align: right; font-variant-numeric: tabular-nums; }
    table.results tr.odd td { background: var(--stripe); }
    /* The grid (grid.js): row numbers, the selection, the spacers that stand for rows not drawn. */
    table.results td.rn, table.results th.rn {
      position: sticky; left: 0; text-align: right; color: var(--muted); min-width: 2.5rem;
      background: var(--vscode-keybindingTable-headerBackground, var(--panel)); user-select: none; cursor: default;
    }
    table.results th.rn { z-index: 2; }
    table.results td { user-select: none; }
    table.results td.sel { background: var(--vscode-list-activeSelectionBackground, var(--sel));
                           color: var(--vscode-list-activeSelectionForeground, var(--text)); }
    table.results td.rn.sel { color: var(--text); }
    table.results tr.spacer td { padding: 0; border: 0; background: none; }
    .resultsWrap:focus { outline: none; }
    #chartView { display: flex; flex-direction: column; height: 100%; min-height: 320px; }
    #chartView[hidden] { display: none; }
    .chartBar { display: flex; gap: 0.9rem; align-items: center; padding: 0.4rem 0.75rem; flex-wrap: wrap; }
    .chartBar select { background: var(--vscode-dropdown-background, var(--panel)); color: var(--vscode-dropdown-foreground, var(--text));
                       border: 1px solid var(--vscode-dropdown-border, var(--border)); }
    .chartNote { color: var(--muted); font-size: 0.8rem; }
    .chartBox { flex: 1; min-height: 280px; }
    .gridBar { position: sticky; left: 0; display: flex; gap: 0.5rem; align-items: center; padding: 0.35rem 0.75rem; }
    .gridBar input { width: 16rem; padding: 0.2rem 0.4rem; background: var(--vscode-input-background, var(--panel));
                     color: var(--vscode-input-foreground, var(--text)); border: 1px solid var(--vscode-input-border, var(--border)); }
    .gridBar span { color: var(--muted); font-size: 0.8rem; }
    #inspector { position: fixed; right: 1rem; bottom: 2.5rem; width: min(42rem, 80vw); max-height: 60vh; z-index: 5;
                 display: flex; flex-direction: column; background: var(--vscode-editorWidget-background, var(--panel));
                 border: 1px solid var(--vscode-editorWidget-border, var(--border)); box-shadow: 0 4px 16px rgba(0,0,0,0.35); }
    #inspector[hidden] { display: none; }
    #inspector header { display: flex; gap: 0.5rem; align-items: center; padding: 0.35rem 0.6rem; border-bottom: 1px solid var(--border); }
    #inspector header span { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #inspector pre { margin: 0; padding: 0.6rem; overflow: auto; white-space: pre-wrap; word-break: break-word;
                     font-family: var(--vscode-editor-font-family); font-size: var(--vscode-editor-font-size); }

    /* Document view — a text result rendered as itself (docview.js). */
    .docBar { position: sticky; top: 0; z-index: 2; display: block; padding: 0.45rem 0.75rem; background: var(--bg); }
    .docView { padding: 0.25rem 1.5rem 2rem; line-height: 1.6; }
    .docView.prose { max-width: 860px; }
    .docView h1, .docView h2 { border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
    .docView pre {
      background: var(--vscode-textCodeBlock-background, var(--panel2)); border: 1px solid var(--border);
      border-radius: 4px; padding: 0.75rem 1rem; overflow: auto;
    }
    /* A whole document that IS code keeps its lines: no prose measure, no wrapping. */
    .docView pre.doc {
      font-family: var(--vscode-editor-font-family); font-size: 0.86rem; line-height: 1.45;
      white-space: pre; overflow-x: auto; margin: 0; tab-size: 4;
    }
    .docView code {
      background: var(--vscode-textCodeBlock-background, var(--panel2)); border-radius: 3px; padding: 0.1rem 0.35rem;
      font-family: var(--vscode-editor-font-family); font-size: 0.9em;
    }
    .docView pre code { background: none; padding: 0; }
    .docView blockquote { margin: 0; padding: 0 1rem; border-left: 3px solid var(--border); color: var(--muted); }
    .docView img { max-width: 100%; }
    .docView table { border-collapse: collapse; }
    .docView th, .docView td { border: 1px solid var(--border); padding: 0.3rem 0.6rem; }

    /* Stats card — metadata key/value rows. */
    #statsView th { text-align: left; font-weight: 500; color: var(--muted); }
    #statsView td { font-variant-numeric: tabular-nums; }
    .statsNote { color: var(--muted); font-size: 0.85rem; }
    /* History — one row per commit or snapshot, newest first. */
    #statsView table.history th { color: var(--text); white-space: nowrap; }
    #statsView table.history td { white-space: nowrap; }
    #statsView table.history td.params { white-space: normal; font-family: var(--vscode-editor-font-family); font-size: 0.85em; }
    #statsView td.num { text-align: right; }

    /* Status bar: the message, where the last answers came from, and the build. */
    .statusBar {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      padding: 0.3rem 0.9rem; border-top: 1px solid var(--border); background: var(--panel2); font-size: 0.82rem;
    }
    #status { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #status.clickable { cursor: pointer; }
    #status.expanded { white-space: pre-wrap; overflow: auto; max-height: 8rem; text-overflow: clip; }
    #status.error { color: var(--err); }
    #status.ok { color: var(--ok); }
    #status.warn { color: var(--warn); }
    #readSrc { color: var(--muted); white-space: nowrap; flex: none; cursor: pointer; font-variant-numeric: tabular-nums; }
    #readSrc:hover { color: var(--text); }
    #readSrc.local { color: var(--ok); }
    #statusVer { color: var(--muted); white-space: nowrap; flex: none; }
    .hint { color: var(--muted); padding: 1.2rem; }
  </style>
</head>
<body>
  <section>
    <div class="toolbar">
      <span class="title" id="activeTable">No table selected</span>
      <div class="spacer"></div>
      <button id="pivotBtn" disabled title="The table's columns on shelves, as a pivot or a chart">Pivot</button>
      <!-- Only on screen while something can be stopped. -->
      <button id="stopBtn" hidden title="Stop">Stop ■</button>
      <button id="chartBtn" disabled title="The rows on screen as a bar, line or scatter chart">Chart</button>
      <button id="profileBtn" disabled title="Each column of the result: its nulls, distinct values, min, max and quartiles, over every row">Profile</button>
      <button id="csvBtn" disabled>Export…</button>
      <button id="editSqlBtn" title="This SQL in the box, to change and run it there (Ctrl+Enter)">Edit SQL</button>
      <button id="saveQueryBtn" title="Keep the box's SQL under Queries in the OneLake sidebar (Ctrl+S)">Save Query</button>
      <button id="planBtn" title="Where the statement spends its time (it runs once to measure)">Plan</button>
      <button id="runBtn" class="primary" title="The statement under the cursor, or the selection (Ctrl+Enter)">Run ▶</button>
    </div>
    <!-- A .bim's semantic model view (explore/view.js), in place of the results. -->
    <div id="modelView" hidden></div>
    <!-- Pivot: the selected table as a one-table model, in Explore's pivot (explore/view.js), in
         place of the results while it is open (app.js: section.pivotOpen). -->
    <div id="pivotView" hidden></div>
    <textarea id="sqlEditor" spellcheck="false" placeholder="Read-only SQL. Ctrl+Enter runs the statement under the cursor. Try: SHOW ALL TABLES"></textarea>
    <div class="resultsWrap">
      <!-- While a TABLE is selected: Stats leads, because statistics cost nothing. -->
      <div class="docBar tabs" id="viewBar" hidden>
        <button id="viewStats" class="tab active">Stats</button><button id="viewHistory" class="tab">History</button><button id="viewData" class="tab">Data</button>
      </div>
      <article id="statsView" class="docView" hidden></article>
      <div class="docBar tabs" id="docBar" hidden>
        <button id="docPretty" class="tab active">Pretty</button><button id="docRaw" class="tab">Raw</button>
      </div>
      <!-- Plan: the query's profile and plan tree (explore/profile.js), in place of the results. -->
      <div id="planView" hidden></div>
      <!-- Chart: the rows on screen drawn (chart.js), in place of the grid. -->
      <div id="chartView" hidden></div>
      <div class="hint" id="resultsHint">Query results appear here.</div>
      <article id="docView" class="docView" hidden></article>
      <!-- The grid's filter and row count (grid.js), while a result is on screen. -->
      <div class="gridBar" id="gridBar" hidden>
        <input id="gridFilter" type="search" placeholder="Filter rows" spellcheck="false">
        <span id="gridCount"></span>
      </div>
      <table class="results" id="resultsTable" hidden></table>
    </div>
    <!-- A cell, whole (grid.js: a double click, or Enter). -->
    <div id="inspector" hidden>
      <header><span id="inspectorTitle"></span><button id="inspectorCopy">Copy</button><button id="inspectorClose" title="Close (Esc)">×</button></header>
      <pre id="inspectorBody"></pre>
    </div>
  </section>

  <div class="statusBar">
    <div id="status">Ready.</div>
    <span id="readSrc" hidden></span>
    <span id="statusVer"></span>
  </div>

  <script nonce="{{nonce}}">window.ONELAKE_STUDIO_CONFIG = {{config}};</script>
  <script type="module" nonce="{{nonce}}" src="{{base}}/app.js"></script>
</body>
</html>
