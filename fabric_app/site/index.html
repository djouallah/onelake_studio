<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore</title>
<link rel="stylesheet" href="./explore/explore.css">
<style>
  /* Black, always: no light theme. explore.css's tokens, and the sign-in gate's
     (storage/auth.js: --bg, --muted, --accent, --on-accent). */
  :root {
    color-scheme: dark;
    --bg: #0a0c10; --panel: #0e1116; --panel2: #12151c; --card: #12151c; --raised: #181c25; --input-bg: #0e1116;
    --border: #262b36; --row-line: #1c212b;
    --text: #f2f4f8; --muted: #9aa3b2; --faint: #6b7483; --disabled: #4a515e;
    --accent: #3987e5; --accent2: #58a6ff; --on-accent: #0a0c10;
    --hairline: rgba(255,255,255,0.07); --hover: rgba(255,255,255,0.07); --hover-soft: rgba(255,255,255,0.035);
    --err: #f85149; --bad: #f85149; --ok: #3fb950; --warn: #d29922;
    --shadow: 0 12px 32px rgba(0,0,0,0.5);
    --radius: 14px; --radius-sm: 8px; --gutter: 1.5rem; --gap: 1rem;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); }
  body { color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  input, select { background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.2rem 0.4rem; }
  ::-webkit-scrollbar { width: 10px; height: 10px; background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--raised); border-radius: 6px; }
  #status { position: fixed; right: 1rem; bottom: 0.6rem; color: var(--muted); font-size: 0.78rem; }
  #status.error { color: var(--err); }
  footer { padding: 0.3rem var(--gutter) 0.5rem; color: var(--faint); font-size: 0.72rem; flex: none; }

  /* The whole window. explore.css is sized for the VS Code panel (a 340px chart, tables
     capped at 60-65vh); here the page is the browser's, so each page stretches to its
     bottom edge and the pivot's table or chart takes what is left. The panel is untouched:
     these rules are this page's only. */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  #explore { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
  #explore > .explore-page:not([hidden]), #explore > .explore-sql-page:not([hidden]),
  #explore > .model-page:not([hidden]) { flex: 1 1 auto; min-height: 0; }
  #explore > .explore-page:not([hidden]) { display: flex; flex-direction: column; padding-bottom: var(--gap); }
  .explore-page > .ex { flex: 1 1 auto; min-height: 0; }
  .ex-fields { max-height: none; }
  .ex-out { min-height: 0; }
  .ex-table { max-height: none; }
  .ex-chart { min-height: 260px; }
  .model-panel { max-height: none; }
  #explore > .explore-sql-page:not([hidden]) { display: flex; flex-direction: column; }
  .explore-sql-page > .explore-table-wrap { flex: 1 1 auto; min-height: 160px; max-height: none; }
  .explore-sql-page > .explore-plan:not([hidden]) { flex: 1 1 auto; }
  /* What the page is doing until Explore is on screen (app.js): the step, and how long. */
  #boot { min-height: 70vh; display: flex; flex-direction: column; gap: 0.9rem; align-items: center; justify-content: center;
          color: var(--muted); text-align: center; padding: 2rem; }
  #boot .spin { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent);
                border-radius: 50%; animation: spin 0.9s linear infinite; }
  #boot .step { color: var(--text); font-size: 1rem; }
  #boot .elapsed { color: var(--faint); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  #boot.error .spin { display: none; }
  #boot.error .step { color: var(--err); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #boot .spin { animation-duration: 3s; } }
</style>
</head>
<body>
<main id="explore">
  <div id="boot" role="status" aria-live="polite">
    <div class="spin"></div>
    <div class="step">Starting…</div>
    <div class="elapsed"></div>
  </div>
</main>
<div id="status" role="status" aria-live="polite"></div>
<footer>build __BUILD__ · Explore, exported from OneLake Studio</footer>
<script type="module">import { start } from "./app.js"; start();</script>
</body>
</html>
