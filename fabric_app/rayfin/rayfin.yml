# The Fabric app Export to Fabric deploys (OneLake Studio, fabric_app/export/exportapp.js and fabricapp.js):
# a model's Report and Explore, over its lakehouse's tables. The extension deploys it over the
# Fabric REST API from the local copy, one .fabricator file, without reading this file; Fabricator
# and `rayfin up` deploy the same project with it. The site is site/public/ as it is, with no
# build (site/vite.config.mjs serves it locally). The id, the name and the sign-in
# redirects are each app's own (written in by the export). Exported as DirectQuery or Direct Lake,
# the export adds a top-level `connectors:` block: the semantic model, as a fabric-semanticmodel
# connector with delegated auth, which the page queries as the person viewing it.
id: explore
name: explore
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
  data:
    enabled: false
  staticHosting:
    enabled: true
    path: site
    folder: public
    indexDocument: index.html
    assetAccess: protected
  storage:
    enabled: false
  functions:
    enabled: true
    buildCommand: npm run build
    auth:
      type: application
secrets:
  - name: CATALOG_URL
    description: The OneLake Iceberg catalog the app reads, https://onelake.table.fabric.microsoft.com/iceberg/<workspace id>/<lakehouse id>; its tables are the ones the model names
  - name: TABLES
    description: The tables the app may read, schema.table, comma-separated, the ones its model names (the model is the site's own model.json)
