<!doctype html>
<!-- Manual integration harness: runs the engine's GENERATED SQL against the real, pinned
     DuckDB-WASM — the parts node --test can't reach. Verifies that PATH_KEY_SQL matches
     paths.js pathKey inside DuckDB, that the createView anti-join applies position
     deletes across abfs/abfss spellings with union_by_name, that Arrow results are
     row-iterable with BIGINT intact, and that prepareReadOnlySql output executes.

     To run: copy into site/, `npm run dev`, open http://localhost:5173/__sqltest
     (or headless: drive it with playwright-core and wait for document.title === "DONE").
     Lives in test/, not site/, so it never deploys. -->
<meta charset="utf-8"><title>engine SQL integration test</title><body>
<div id="log">START</div>
<script type="module">
const el = document.getElementById("log");
const log = m => { el.textContent += "\n" + m; };
const fail = m => log("FAIL " + m);
const pass = m => log("PASS " + m);
window.addEventListener("error", e => log("WINERR " + e.message));
window.addEventListener("unhandledrejection", e => log("UNHANDLED " + (e.reason && e.reason.message)));

log("module running");
try {
  const paths = await import("./paths.js");
  const { pathKey, PATH_KEY_SQL, sqlStr, prepareReadOnlySql } = paths;
  log("paths.js loaded");

  const duckdb = await import("https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.33.1-dev57.0/+esm");
  log("duckdb module loaded");
  const bundle = await duckdb.selectBundle(duckdb.getJsDelivrBundles());
  log("bundle: " + bundle.mainModule.split("/").pop());
  const workerUrl = URL.createObjectURL(new Blob([`importScripts("${bundle.mainWorker}");`], { type: "text/javascript" }));
  const worker = new Worker(workerUrl);
  const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(), worker);
  await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
  log("instantiated");
  const conn = await db.connect();
  log("duckdb ready");

  // --- 1. PATH_KEY_SQL must agree with JS pathKey on every spelling -----------
  const samples = [
    "abfs://WS@onelake.dfs.fabric.microsoft.com/ITEM/Tables/t/f.parquet",
    "abfss://WS@onelake.dfs.fabric.microsoft.com/ITEM/Tables/t/f.parquet",
    "https://onelake.dfs.fabric.microsoft.com/WS/ITEM/Tables/t/f.parquet",
    "WS/ITEM/Tables/t/f.parquet",
    "abfss://ws-guid@onelake.dfs.fabric.microsoft.com/item/Tables/t/part%20x/f-00001.parquet",
  ];
  const values = samples.map(s => `(${sqlStr(s)})`).join(", ");
  const r1 = await conn.query(`SELECT ${PATH_KEY_SQL("p")} AS k FROM (VALUES ${values}) v(p)`);
  const got = r1.toArray().map(r => r.toJSON().k);
  let ok1 = true;
  samples.forEach((s, i) => {
    const want = pathKey(s);
    if (got[i] !== want) { ok1 = false; fail(`PATH_KEY_SQL(${s}) = ${got[i]}, JS pathKey = ${want}`); }
  });
  if (ok1) pass("PATH_KEY_SQL agrees with pathKey on all samples");

  // --- 2. The exact createView anti-join shape, on real parquet files ---------
  await conn.query(`COPY (SELECT * FROM (VALUES (1), (2), (3)) t(a)) TO 'data_1.parquet' (FORMAT PARQUET)`);
  await conn.query(`COPY (SELECT * FROM (VALUES (4, 'x'), (5, 'y')) t(a, b)) TO 'data_2.parquet' (FORMAT PARQUET)`);

  const orig1 = "abfss://WS@onelake.dfs.fabric.microsoft.com/ITEM/Tables/t/data-1.parquet";
  const orig2 = "abfss://WS@onelake.dfs.fabric.microsoft.com/ITEM/Tables/t/data-2.parquet";
  await conn.query(`CREATE OR REPLACE TABLE __map_t AS SELECT * FROM (VALUES
    ('data_1.parquet', ${sqlStr(pathKey(orig1))}),
    ('data_2.parquet', ${sqlStr(pathKey(orig2))})) v(reg, pk)`);

  const del1 = "abfs://WS@onelake.dfs.fabric.microsoft.com/ITEM/Tables/t/data-1.parquet";
  const del2 = "abfs://WS@onelake.dfs.fabric.microsoft.com/ITEM/Tables/t/data-2.parquet";
  await conn.query(`COPY (SELECT * FROM (VALUES
    (${sqlStr(del1)}, 1), (${sqlStr(del2)}, 0)) t(file_path, pos))
    TO 'del_1.parquet' (FORMAT PARQUET)`);
  await conn.query(`CREATE OR REPLACE TABLE __del_t AS
    SELECT ${PATH_KEY_SQL("file_path")} AS pk, pos
    FROM read_parquet(['del_1.parquet'], union_by_name = true)`);

  await conn.query(`CREATE OR REPLACE VIEW "t" AS
    SELECT * EXCLUDE (filename, file_row_number)
    FROM read_parquet(['data_1.parquet', 'data_2.parquet'], union_by_name = true,
                      filename = true, file_row_number = true) x
    WHERE NOT EXISTS (
      SELECT 1 FROM __del_t d JOIN __map_t m ON m.pk = d.pk
      WHERE m.reg = x.filename AND d.pos = x.file_row_number)`);

  const r2 = await conn.query(`SELECT a, b FROM "t" ORDER BY a`);
  const rows = r2.toArray().map(r => r.toJSON());
  const wantRows = JSON.stringify([{ a: 1, b: null }, { a: 3, b: null }, { a: 5, b: "y" }]);
  const gotRows = JSON.stringify(rows.map(r => ({ a: Number(r.a), b: r.b ?? null })));
  if (gotRows === wantRows) pass("anti-join view: deletes applied across abfs/abfss, union_by_name fills NULLs");
  else fail(`anti-join view rows = ${gotRows}, want ${wantRows}`);

  const r3 = await conn.query(`SELECT count(*) AS n FROM __del_t d
    WHERE NOT EXISTS (SELECT 1 FROM __map_t m WHERE m.pk = d.pk)`);
  const n = Number(r3.toArray()[0].toJSON().n);
  if (n === 0) pass("countUnmatchedDeletes = 0 when everything matches");
  else fail(`countUnmatchedDeletes = ${n}, want 0`);

  // --- 3. runSql's row iteration: `for (const r of res)` with r.toJSON() ------
  const r4 = await conn.query(`SELECT 9007199254740993 AS big, 'x' AS s`);
  let iterated = 0, bigType = "";
  for (const r of r4) { iterated++; const j = r.toJSON(); bigType = typeof j.big; }
  if (iterated === 1 && (bigType === "bigint" || bigType === "number"))
    pass(`arrow Table is row-iterable; BIGINT arrives as ${bigType}`);
  else fail(`iteration yielded ${iterated} rows, big typeof ${bigType}`);

  // --- 4. prepareReadOnlySql output actually runs -----------------------------
  const q = prepareReadOnlySql("SELECT 'a;b' AS v -- trailing comment");
  const r5 = await conn.query(q);
  const v = r5.toArray()[0].toJSON().v;
  if (v === "a;b") pass("prepareReadOnlySql output runs and preserves the literal");
  else fail(`literal came back as ${v}`);

  // --- 5. ATTACH of a .duckdb file, the shape loadDatabaseFile() uses ---------
  // Attach over HTTP — the exact production shape: registerFileURL then ATTACH
  // (READ_ONLY), so DuckDB range-reads the database blocks like it does parquet.
  // The fixture is generated by test/fixtures/make_sample.py (main.t1 with rows
  // (1,'a'),(2,'b') and view main.v1); copy it into site/ as __sample.duckdb
  // alongside this page before running.
  try {
    await db.registerFileURL("dbfile_ro.duckdb", location.origin + "/__sample.duckdb",
                             duckdb.DuckDBDataProtocol.HTTP, false);
    log("s5: registered HTTP url");
    await conn.query(`ATTACH 'dbfile_ro.duckdb' AS "ro" (READ_ONLY)`);
    log("s5: attached ro over HTTP");
    const disc = (await conn.query(
      `SELECT schema_name AS s, table_name AS t
         FROM duckdb_tables() WHERE database_name = 'ro'
       UNION ALL
       SELECT schema_name, view_name
         FROM duckdb_views() WHERE database_name = 'ro' AND NOT internal
       ORDER BY 1, 2`)).toArray().map(r => r.toJSON());
    const names = disc.map(r => `${r.s}.${r.t}`).join(",");
    if (names === "main.t1,main.v1") pass("ATTACH READ_ONLY + discovery finds tables and views");
    else fail(`discovery found [${names}], want [main.t1,main.v1]`);

    const r6 = await conn.query(`SELECT count(*) AS n FROM "ro"."main"."t1"`);
    const cnt = Number(r6.toArray()[0].toJSON().n);
    if (cnt === 2) pass("querying an attached read-only database works");
    else fail(`attached table count = ${cnt}, want 2`);

    // Writes must be refused — the app promises read-only.
    let blocked = false;
    try { await conn.query(`INSERT INTO "ro"."main"."t1" VALUES (3, 'c')`); }
    catch (_) { blocked = true; }
    if (blocked) pass("READ_ONLY attachment refuses writes");
    else fail("READ_ONLY attachment accepted an INSERT");

    await conn.query(`DETACH "ro"`);
    pass("DETACH works (release path)");
  } catch (e) {
    fail("attach harness: " + String(e) + (e && e.stack ? " @ " + String(e.stack).split("\n")[1] : ""));
  }

  // --- 6. SQLite file served as .db: sniff, then sql.js -> DuckDB copy ---------
  // DuckDB's own sqlite extension is a dead end in this WASM build: its VFS cannot open
  // a registered buffer, a registered HTTP URL, or a direct URL through httpfs (all
  // measured to fail with SQLITE_CANTOPEN). So production opens SQLite files with
  // sql.js and copies each table into DuckDB via NDJSON — which is what this mirrors,
  // using the same SQL shapes as loadSqliteFile().
  try {
    const bytes = new Uint8Array(await (await fetch("/__sample_sqlite.db")).arrayBuffer());
    const { isSqliteHeader } = paths;
    if (isSqliteHeader(bytes)) pass("header sniff identifies the SQLite file");
    else fail("header sniff missed 'SQLite format 3'");
    const duckBytes = new Uint8Array(await (await fetch("/__sample.duckdb", { headers: { Range: "bytes=0-15" } })).arrayBuffer());
    if (!isSqliteHeader(duckBytes)) pass("header sniff does not misfire on a DuckDB file");
    else fail("header sniff misidentified the DuckDB file as SQLite");

    const sqljsMod = await import("https://cdn.jsdelivr.net/npm/sql.js@1.13.0/+esm");
    const initSqlJs = sqljsMod.default || sqljsMod;
    const SQL = await initSqlJs({ locateFile: f => `https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/${f}` });
    log("s6: sql.js ready");
    const sdb = new SQL.Database(bytes);

    const master = sdb.exec(`SELECT name FROM sqlite_master WHERE type IN ('table','view')
                             AND name NOT LIKE 'sqlite_%' ORDER BY name`);
    const names = (master[0] ? master[0].values : []).map(v => String(v[0]));
    if (names.join(",") === "s1") pass("sql.js lists the SQLite tables");
    else fail(`sql.js found [${names.join(",")}], want [s1]`);

    await conn.query(`CREATE SCHEMA IF NOT EXISTS "sqfix"`);
    const data = sdb.exec(`SELECT * FROM "s1"`)[0];
    const lines = data.values.map(row => JSON.stringify(Object.fromEntries(
      data.columns.map((c, i) => [c, row[i] instanceof Uint8Array ? null : row[i]])))).join("\n");
    await db.registerFileBuffer("sqfix.json", new TextEncoder().encode(lines));
    await conn.query(`CREATE OR REPLACE TABLE "sqfix"."s1" AS
                      SELECT * FROM read_json('sqfix.json', format='newline_delimited')`);
    sdb.close();

    const r7 = await conn.query(`SELECT count(*) AS n, max(s) AS m FROM "sqfix"."s1"`);
    const j = r7.toArray()[0].toJSON();
    if (Number(j.n) === 3 && j.m === "c") pass("SQLite table copied into DuckDB and queryable");
    else fail(`sqlite copy got n=${j.n} m=${j.m}, want n=3 m=c`);

    await conn.query(`DROP SCHEMA "sqfix" CASCADE`);
    pass("DROP SCHEMA CASCADE works (release path)");
  } catch (e) {
    fail("sqlite harness: " + String(e) + (e && e.stack ? " @ " + String(e.stack).split("\n")[1] : ""));
  }

  // --- 7. h3 community extension — mirrors init()'s tryLoadExt("h3", "community") -----
  // Expected cell cross-checked against native DuckDB (INSTALL h3 FROM community).
  // If this fails after a pin bump, check community-extensions.duckdb.org serves the
  // new engine version for wasm_eh before blaming the app.
  try {
    try { await conn.query(`LOAD h3;`); }
    catch (_) { await conn.query(`INSTALL h3 FROM community; LOAD h3;`); }
    const c = (await conn.query(
      `SELECT h3_latlng_to_cell_string(37.7887987, -122.3931578, 9) AS c`)).toArray()[0].toJSON().c;
    if (c === "89283082a0fffff") pass("h3 community extension loads and answers");
    else fail(`h3 cell = ${c}, want 89283082a0fffff`);
  } catch (e) {
    fail("h3 harness: " + (e && e.message));
  }

  // --- 8. zipfs community extension — mirrors loadZipFile(): registerFileURL over -----
  // HTTP (the production shape; range reads, no full download), zip_contents to list,
  // a view per readable entry. Fixture: test/fixtures/sample.zip (make_sample.py),
  // copied into site/ as __sample.zip alongside this page.
  try {
    try { await conn.query(`LOAD zipfs;`); }
    catch (_) { await conn.query(`INSTALL zipfs FROM community; LOAD zipfs;`); }
    await db.registerFileURL("zipfile_it.zip", location.origin + "/__sample.zip",
                             duckdb.DuckDBDataProtocol.HTTP, false);
    const ents = (await conn.query(
      `SELECT file_name AS n FROM zip_contents('zipfile_it.zip') WHERE NOT is_directory`))
      .toArray().map(r => r.toJSON().n);
    if (ents.join(",") === "points.csv") pass("zip_contents lists the archive over a registered URL");
    else fail(`zip_contents found [${ents.join(",")}], want [points.csv]`);
    await conn.query(`CREATE OR REPLACE VIEW "zip_points" AS
                      SELECT * FROM read_csv_auto('zip://zipfile_it.zip/points.csv')`);
    const zn = Number((await conn.query(`SELECT count(*) AS n FROM "zip_points"`)).toArray()[0].toJSON().n);
    if (zn === 2) pass("view over zip:// entry answers");
    else fail(`zip entry count = ${zn}, want 2`);
    await conn.query(`DROP VIEW "zip_points"`);
    await db.dropFile("zipfile_it.zip");
    pass("zip release path works (DROP VIEW + dropFile)");
  } catch (e) {
    fail("zipfs harness: " + (e && e.message));
  }

  // --- 9. isDocResult against real Arrow types — the gate on the Pretty markdown ------
  // view. Shapes the result exactly like runSql() does (arrowTypeName from data.js),
  // so this proves DuckDB's Utf8 really arrives as the 'VARCHAR' string the heuristic
  // matches on. The Pretty render itself (CDN fetch of marked) is app-only and needs
  // real Chrome — it never fires under a --virtual-time-budget headless run.
  try {
    const { isDocResult } = paths;
    const { arrowTypeName } = await import("./data.js");
    const shape = r => ({
      fields: r.schema.fields.map(f => f.name),
      types: r.schema.fields.map(f => arrowTypeName(f.type)),
      rows: r.toArray().map(x => x.toJSON()),
    });
    const doc = shape(await conn.query(`SELECT 'l1' || chr(10) || 'l2' AS doc`));
    const scalar = shape(await conn.query(`SELECT 42 AS v`));
    if (doc.types[0] === "VARCHAR" && isDocResult(doc)) pass("isDocResult accepts a real 1×1 multiline VARCHAR");
    else fail(`isDocResult(doc) = ${isDocResult(doc)}, types = [${doc.types}]`);
    if (!isDocResult(scalar)) pass("isDocResult rejects SELECT 42");
    else fail(`isDocResult(SELECT 42) = true, types = [${scalar.types}]`);
  } catch (e) {
    fail("isDocResult harness: " + (e && e.message));
  }

  log("DONE");
  document.title = "DONE";
} catch (e) {
  fail("harness: " + (e && e.message));
  log("DONE");
  document.title = "DONE";
}
</script>
