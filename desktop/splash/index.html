<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OneLake Studio</title>
<style>
  :root { color-scheme: dark; font: 14px 'Segoe UI', system-ui, sans-serif; }
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #1e1e1e; color: #cccccc; user-select: none; }
  main { text-align: center; max-width: 560px; padding: 24px; }
  h1 { font-weight: 400; font-size: 26px; margin: 0 0 8px; }
  p { opacity: .75; margin: 0; overflow-wrap: anywhere; }
  .bad { color: #f85149; opacity: 1; user-select: text; }
  button { margin-top: 20px; font: inherit; color: #fff; background: #0078d4; border: 1px solid rgba(255,255,255,.07); border-radius: 2px; padding: 4px 14px; cursor: pointer; }
  button:hover { background: #026ec1; }
</style>
</head>
<body>
<main>
  <h1>OneLake Studio</h1>
  <p id="say">Starting…</p>
  <button id="restart" hidden>Restart</button>
</main>
<script>
  // The window comes back here with ?failed=<why> when the app's Node process couldn't start, and with
  // ?stopped when it ended. Restart starts it again.
  const query = new URLSearchParams(location.search);
  const say = document.getElementById('say');
  const restart = document.getElementById('restart');
  if (query.has('failed') || query.has('stopped')) {
    say.textContent = query.has('failed')
      ? `OneLake Studio could not start: ${query.get('failed')}`
      : 'OneLake Studio stopped. The SQL you were last writing comes back in your next query.';
    say.className = 'bad';
    restart.hidden = false;
    restart.focus();
  }
  restart.addEventListener('click', () => {
    restart.hidden = true;
    say.textContent = 'Starting…';
    say.className = '';
    window.__TAURI__.core.invoke('restart');
  });
</script>
</body>
</html>
